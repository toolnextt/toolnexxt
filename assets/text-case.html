<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Text Case Converter — ToolNextt</title><link rel="stylesheet" href="/assets/style.css"/><script defer src="/assets/app.js"></script></head><body>
<div class="container">
  <header class="header">...standard header...</header>
  <section>
    <h3>Text Case Converter</h3>
    <textarea id="case_text" style="width:100%;min-height:140px;padding:12px;border-radius:8px;border:1px solid var(--glass-border)"></textarea>
    <div style="margin-top:8px;display:flex;gap:8px"><button class="btn" onclick="convertCase('upper')">UPPERCASE</button><button class="btn" onclick="convertCase('lower')">lowercase</button><button class="btn" onclick="convertCase('sentence')">Sentence case</button></div>
  </section>
  <footer>...standard footer...</footer>
</div>
<script>
function convertCase(mode){
  const el = document.getElementById('case_text'); if(!el) return;
  const v = el.value || '';
  if(mode==='upper') el.value = v.toUpperCase();
  else if(mode==='lower') el.value = v.toLowerCase();
  else if(mode==='sentence') el.value = v.replace(/(^\s*\w|[.!?]\s*\w)/g, c => c.toUpperCase());
}
</script>
</body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Password Generator — ToolNextt</title><link rel="stylesheet" href="/assets/style.css"/><script defer src="/assets/app.js"></script></head><body>
<div class="container">
  <header class="header">...standard header...</header>
  <section>
    <h3>Password Generator</h3>
    <div style="display:flex;gap:8px;align-items:center">
      <input id="pw_len" type="number" min="4" max="64" value="16" style="width:100px;padding:8px" />
      <button class="btn" onclick="generatePassword()">Generate</button>
    </div>
    <input id="pw_out" readonly style="width:100%;margin-top:12px;padding:10px;border-radius:8px;border:1px solid var(--glass-border)"/>
  </section>
  <footer>...standard footer...</footer>
</div>
<script>
function generatePassword(){
  const len = parseInt(document.getElementById('pw_len').value || 16,10);
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()-_=+[]{}|;:,.<>?';
  let out = ''; for(let i=0;i<len;i++) out += chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('pw_out').value = out;
  try{ navigator.clipboard.writeText(out); }catch(e){}
}
</script>
</body></html>
